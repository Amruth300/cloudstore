version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-cloudstore}
      POSTGRES_USER: ${DB_USERNAME:-cloudstore}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudstore}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cloudstore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: ${DB_NAME:-cloudstore}
      DB_USERNAME: ${DB_USERNAME:-cloudstore}
      DB_PASSWORD: ${DB_PASSWORD:-cloudstore}
      # NEVER commit real secrets - supply these via a local .env file (gitignored) or CI secrets.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, e.g. in a local .env file}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:?GCS_BUCKET_NAME must be set}
      GCS_CREDENTIALS_LOCATION: file:/secrets/gcs-key.json
    volumes:
      - ${GCS_CREDENTIALS_FILE:-./gcs-key.json}:/secrets/gcs-key.json:ro

volumes:
  postgres_data:
